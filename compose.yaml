name: sitewatch

services:
  worker:
    build: .
    image: sitewatch:1.0
    
    env_file:
      - .env
    volumes:
      - type: bind
        source: ./checks.log
        target: /app/checks.log
        bind: 
          create_host_path: false
    restart: unless-stopped
  web:
    image: sitewatch:1.0
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "dashboard:app"]

    # ports:
    #   - "127.0.0.1:8000:8000"

    volumes:
      - type: bind
        source: ./checks.log
        target: /app/checks.log
        read_only: true
        bind:
          create_host_path: false

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
  nginx:
    image: nginx:stable-alpine

    ports:
      - "127.0.0.1:8080:80"

    volumes:
      - type: bind
        source: ./nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false

    depends_on:
      web:
        condition: service_healthy

    restart: unless-stopped

 